<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>教育部学历证书电子注册备案表</title>
<style>
:root {
  --blue: #1a5f9b;
  --bg: #f5f5f5;
  --border: #d0d0d0;
  --light-bg: #fafafa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SimSun","宋体",serif;background:var(--bg);min-height:100vh;color:#333}
.no-data{text-align:center;padding:80px 20px;color:#999;font-size:15px}
.no-data a{color:var(--blue);text-decoration:underline}

/* Print Toolbar */
.toolbar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #ddd;padding:10px 20px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.toolbar button,.toolbar a.btn{border:none;padding:8px 20px;border-radius:6px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn-print{background:var(--blue);color:#fff}
.btn-print:hover{opacity:.9}
.btn-back{background:#eee;color:#555}
.btn-back:hover{background:#ddd}
.toolbar .hint{font-size:12px;color:#aaa;margin-left:8px}

/* A4 Page */
.page{width:210mm;min-height:297mm;margin:20px auto;background:#fff;padding:12mm 15mm;position:relative;box-shadow:0 2px 12px rgba(0,0,0,.08)}

/* Blue Header Bar */
.header-bar{background:var(--blue);height:6px;margin:-12mm -15mm 0 -15mm}

/* Header */
.report-header{text-align:center;padding:18px 0 12px}
.report-header h1{font-size:18px;font-weight:bold;letter-spacing:2px;color:#111;margin-bottom:4px}
.report-header .subtitle{font-size:11px;color:#666;letter-spacing:1px}

/* Info Row (photo + table) */
.info-wrapper{display:flex;gap:16px;margin-bottom:10px}
.info-table{flex:1;border-collapse:collapse;font-size:13px}
.info-table td{padding:6px 8px;border:1px solid var(--border);line-height:1.6}
.info-table .label{background:var(--light-bg);text-align:center;width:90px;font-weight:bold;white-space:nowrap}
.info-table .value{min-width:110px}

/* Photo Box */
.photo-box{width:120px;flex-shrink:0;text-align:center}
.photo-box img{width:110px;height:140px;object-fit:cover;border:1px solid var(--border);border-radius:2px;display:block;margin:0 auto 4px}
.photo-box .photo-label{font-size:11px;color:#888}

/* Section Title */
.section-title{font-size:14px;font-weight:bold;text-align:center;padding:8px 0 6px;border-bottom:2px solid var(--blue);margin:10px 0 8px;letter-spacing:1px}

/* Education Table */
.edu-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
.edu-table td{padding:6px 8px;border:1px solid var(--border);line-height:1.6}
.edu-table .label{background:var(--light-bg);text-align:center;width:100px;font-weight:bold}
.edu-table .value{}

/* Verify Section */
.verify-section{margin-top:14px;padding:10px;border:1px dashed var(--border);background:#fdfdff}
.verify-title{font-size:13px;font-weight:bold;text-align:center;margin-bottom:8px;letter-spacing:1px}
.verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:12px}
.verify-grid .v-item{display:flex}
.verify-grid .v-label{color:#666;white-space:nowrap}
.verify-grid .v-val{font-weight:bold;color:var(--blue);margin-left:6px;letter-spacing:1px}
.verify-qrcode{text-align:center;margin-top:8px;padding:6px;font-size:11px;color:#999;border:1px dashed #ddd;width:100px;height:100px;display:flex;align-items:center;justify-content:center;margin-left:auto;margin-right:auto;line-height:1.5}

/* Footer */
.report-footer{margin-top:16px;padding-top:10px;border-top:1px solid var(--border);font-size:10px;color:#999;line-height:1.8;text-align:justify}
.report-footer .warn{color:#c00}

/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:bold}
.badge-active{background:#e8f5e9;color:#2e7d32}
.badge-grad{background:#e3f2fd;color:var(--blue)}

/* Separator */
.sep-line{border:none;border-top:1px dashed var(--border);margin:12px 0}

/* Print */
@media print {
  body{background:#fff}
  .toolbar{display:none !important}
  .page{box-shadow:none;margin:0;width:auto;min-height:auto;padding:8mm 12mm}
  .header-bar{margin:-8mm -12mm 0 -12mm}
  @page{size:A4;margin:0}
}

/* Mobile adjust */
@media screen and (max-width:800px){
  .page{width:100%;margin:10px;padding:10px}
  .header-bar{margin:-10px -10px 0 -10px}
  .info-wrapper{flex-direction:column-reverse;align-items:center}
  .photo-box{width:100px}
  .info-table td{font-size:11px;padding:4px}
  .verify-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-print" onclick="window.print()">🖨️ 打印备案表</button>
  <a class="btn-back" href="index.html">← 返回首页</a>
  <span class="hint">如需截屏，请直接滚动截取下方完整页面</span>
</div>

<div id="reportContainer"></div>

<script>
// ========== DATA DECODE ==========
function decodeData(str) {
  try {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    var json = decodeURIComponent(escape(atob(str)));
    return JSON.parse(json);
  } catch(e) { return null; }
}

function getUrlParam(key) {
  var m = location.search.match(new RegExp('[?&]' + key + '=([^&]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}

// Load data from URL (supports ?s= short link and ?d= fallback)
var encoded = getUrlParam('d');
var data = encoded ? decodeData(encoded) : null;

function hasInfo(d) {
  return !!(d && d.name && d.school);
}

// 本地存储回退 (与 index.html 共享 localStorage key)
var LOCAL_STORE = {};
try {
  var saved = localStorage.getItem('edu_local_store');
  if (saved) LOCAL_STORE = JSON.parse(saved);
} catch(e) {}

// Check ?s= short link first
var shortId = getUrlParam('s');
if (shortId) {
  fetch('/api/store?id=' + encodeURIComponent(shortId))
    .then(function(resp) { return resp.ok ? resp.json() : null; })
    .then(function(loaded) {
      if (loaded && loaded.name) { data = loaded; }
      else if (LOCAL_STORE[shortId]) { data = LOCAL_STORE[shortId]; }
      if (data) {
        renderReport(data);
      } else {
        document.getElementById('reportContainer').innerHTML = '<div class="no-data"><p>链接已失效或不存在</p><p style="margin-top:10px"><a href="index.html">→ 前往填写信息</a></p></div>';
      }
    })
    .catch(function() {
      // API 失败,尝试本地存储回退
      if (LOCAL_STORE[shortId]) {
        renderReport(LOCAL_STORE[shortId]);
      } else {
        document.getElementById('reportContainer').innerHTML = '<div class="no-data"><p>加载失败，请重试</p></div>';
      }
    });
} else if (data) {
  renderReport(data);
} else {
  document.getElementById('reportContainer').innerHTML = '<div class="no-data"><p>未检测到分享数据</p><p style="margin-top:10px">请使用 <a href="index.html">分享链接</a> 打开此页面</p></div>';
}

function hasGradInfo(d) {
  return !!(d && d.grad_name && d.grad_school);
}

function safeVal(v) { return v || '—'; }

function dateStr(y,m,d) {
  if (!y) return '—';
  return y + '年' + (m||'') + '月' + (d||'') + '日';
}

function generateVerifyCode() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXY23456789';
  var code = '';
  for (var i = 0; i < 16; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function generateReportNo() {
  var now = new Date();
  return '在线验证报告_' + now.getFullYear() + (now.getMonth()+1).toString().padStart(2,'0') + now.getDate().toString().padStart(2,'0') + '_' + Math.random().toString(36).slice(2,8).toUpperCase();
}

// ========== RENDER ==========
function renderReport(d) {
  var verifyCode = generateVerifyCode();
  var reportNo = generateReportNo();
  var now = new Date();
  var expireDate = new Date(now.getFullYear()+1, now.getMonth(), now.getDate());
  var expireStr = expireDate.getFullYear()+'年'+(expireDate.getMonth()+1)+'月'+expireDate.getDate()+'日';
  var issueDate = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';

  var ugLevel = d.academic_qualification || '本科';
  var gradLevel = d.grad_academic_qualification || '硕士研究生';
  var showGrad = hasGradInfo(d);

  var html = '';

  // ======== UNDERGRAD REPORT ========
  html += '<div class="page">';
  html += '<div class="header-bar"></div>';
  html += '<div class="report-header">';
  html += '<h1>教育部学历证书电子注册备案表</h1>';
  html += '<div class="subtitle">中国高等教育学生信息网（学信网） | www.chsi.com.cn</div>';
  html += '</div>';

  // Basic info row
  html += '<div class="info-wrapper">';
  html += '<table class="info-table">';
  html += '<tr>';
  html += '<td class="label">姓名</td><td class="value">' + safeVal(d.name) + '</td>';
  html += '<td class="label">性别</td><td class="value">' + safeVal(d.gender) + '</td>';
  html += '<td class="label">民族</td><td class="value">' + safeVal(d.nation) + '</td>';
  html += '</tr><tr>';
  html += '<td class="label">出生日期</td><td class="value">' + dateStr(d.nian,d.yue,d.ri) + '</td>';
  html += '<td class="label">身份证号</td><td class="value" colspan="3">' + (d.id_number ? d.id_number.replace(/(\d{6})\d{8}(\d{4})/,'$1********$2') : '—') + '</td>';
  html += '</tr><tr>';
  html += '<td class="label">学历层次</td><td class="value">';
  html += ugLevel;
  html += '</td>';
  html += '<td class="label">学习形式</td><td class="value" colspan="3">' + safeVal(d.form || d.xltype) + '</td>';
  html += '</tr><tr>';
  html += '<td class="label">入学时间</td><td class="value">' + safeVal(d.entrance_date) + '</td>';
  html += '<td class="label">毕业时间</td><td class="value" colspan="3">' + safeVal(d.graduate_date) + '</td>';
  html += '</tr><tr>';
  html += '<td class="label">学制</td><td class="value">' + safeVal(d.educational_system) + '</td>';
  html += '<td class="label">学籍状态</td><td class="value" colspan="3">';
  html += '<span class="badge ' + (d.zhuangtai && d.zhuangtai.indexOf('在籍')>=0 ? 'badge-active' : '') + '">' + safeVal(d.zhuangtai) + '</span>';
  html += '</td>';
  html += '</tr>';
  html += '</table>';

  // Photo
  html += '<div class="photo-box">';
  if (d.image_a) {
    html += '<img src="' + d.image_a + '" alt="录取照片" onerror="this.style.display=\'none\'">';
    html += '<div class="photo-label">录取照片</div>';
  } else {
    html += '<div style="width:110px;height:140px;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px">暂无照片</div>';
  }
  html += '</div>';
  html += '</div>';

  // Education details
  html += '<div class="section-title">学历信息</div>';
  html += '<table class="edu-table">';
  html += '<tr><td class="label">院校名称</td><td class="value" colspan="3">' + safeVal(d.school) + '</td></tr>';
  html += '<tr><td class="label">专业名称</td><td class="value">' + safeVal(d.major) + '</td>';
  html += '<td class="label">层次</td><td class="value">' + ugLevel + '</td></tr>';
  html += '<tr><td class="label">院系</td><td class="value">' + safeVal(d.fenyuan) + '</td>';
  html += '<td class="label">学号</td><td class="value">' + safeVal(d.student_id) + '</td></tr>';
  html += '<tr><td class="label">学习形式</td><td class="value">' + safeVal(d.form || d.xltype) + '</td>';
  html += '<td class="label">培养方式</td><td class="value">' + safeVal(d.grad_category) + '</td></tr>';
  html += '<tr><td class="label">学校类型</td><td class="value">' + safeVal(d.school_type) + '</td>';
  html += '<td class="label">毕业生类别</td><td class="value">' + safeVal(d.xllb) + '</td></tr>';
  html += '<tr><td class="label">班级</td><td class="value">' + safeVal(d.banji) + '</td>';
  html += '<td class="label">证书编号</td><td class="value">' + safeVal(d.bianhao) + '</td></tr>';
  html += '</table>';

  // Verification
  html += '<div class="verify-section">';
  html += '<div class="verify-title">在线验证</div>';
  html += '<div class="verify-grid">';
  html += '<div class="v-item"><span class="v-label">在线验证码：</span><span class="v-val">' + verifyCode + '</span></div>';
  html += '<div class="v-item"><span class="v-label">报告编号：</span><span class="v-val">' + reportNo + '</span></div>';
  html += '<div class="v-item"><span class="v-label">发证日期：</span><span class="v-val">' + issueDate + '</span></div>';
  html += '<div class="v-item"><span class="v-label">有效期至：</span><span class="v-val">' + expireStr + '</span></div>';
  html += '</div>';
  html += '<div class="verify-qrcode">扫码验证<br>（仅供展示）</div>';
  html += '</div>';

  // Footer
  html += '<div class="report-footer">';
  html += '<p><b>说明：</b></p>';
  html += '<p>1、备案表是依据《高等学校学生学籍学历电子注册办法》（教学[2014]11号）对学历证书电子注册复核备案的结果。</p>';
  html += '<p>2、本备案表为模拟样式，仅供展示用途。正式学信网备案表请访问 https://www.chsi.com.cn 获取。</p>';
  html += '<p class="warn">★ 本页面仅供个人展示使用，不具有官方效力。</p>';
  html += '</div>';

  html += '</div>';

  // ======== GRAD REPORT (if present) ========
  if (showGrad) {
    html += '<div class="page" style="margin-top:24px;">';
    html += '<div class="header-bar"></div>';
    html += '<div class="report-header">';
    html += '<h1>教育部学历证书电子注册备案表</h1>';
    html += '<div class="subtitle">中国高等教育学生信息网（学信网） | www.chsi.com.cn</div>';
    html += '<div style="margin-top:4px"><span class="badge badge-grad">研究生学历</span></div>';
    html += '</div>';

    html += '<div class="info-wrapper">';
    html += '<table class="info-table">';
    html += '<tr>';
    html += '<td class="label">姓名</td><td class="value">' + safeVal(d.grad_name || d.name) + '</td>';
    html += '<td class="label">性别</td><td class="value">' + safeVal(d.grad_gender || d.gender) + '</td>';
    html += '<td class="label">民族</td><td class="value">' + safeVal(d.grad_nation || d.nation) + '</td>';
    html += '</tr><tr>';
    html += '<td class="label">出生日期</td><td class="value">' + dateStr(d.grad_nian || d.nian, d.grad_yue || d.yue, d.grad_ri || d.ri) + '</td>';
    html += '<td class="label">身份证号</td><td class="value" colspan="3">' + (d.id_number ? d.id_number.replace(/(\d{6})\d{8}(\d{4})/,'$1********$2') : '—') + '</td>';
    html += '</tr><tr>';
    html += '<td class="label">学历层次</td><td class="value">';
    html += safeVal(d.grad_academic_qualification);
    html += '</td>';
    html += '<td class="label">学位类型</td><td class="value">' + safeVal(d.grad_degree_type) + '</td>';
    html += '</tr><tr>';
    html += '<td class="label">入学时间</td><td class="value">' + safeVal(d.grad_entrance_date) + '</td>';
    html += '<td class="label">毕业时间</td><td class="value" colspan="3">' + safeVal(d.grad_graduate_date) + '</td>';
    html += '</tr><tr>';
    html += '<td class="label">学制</td><td class="value">' + safeVal(d.grad_educational_system) + '</td>';
    html += '<td class="label">学籍状态</td><td class="value" colspan="3">';
    html += '<span class="badge ' + (d.grad_zhuangtai && d.grad_zhuangtai.indexOf('在籍')>=0 ? 'badge-active' : '') + '">' + safeVal(d.grad_zhuangtai) + '</span>';
    html += '</td>';
    html += '</tr>';
    html += '</table>';

    html += '<div class="photo-box">';
    if (d.grad_image_a) {
      html += '<img src="' + d.grad_image_a + '" alt="录取照片" onerror="this.style.display=\'none\'">';
      html += '<div class="photo-label">录取照片</div>';
    } else {
      html += '<div style="width:110px;height:140px;border:1px dashed #ccc;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px">暂无照片</div>';
    }
    html += '</div>';
    html += '</div>';

    html += '<div class="section-title">学历信息</div>';
    html += '<table class="edu-table">';
    html += '<tr><td class="label">院校名称</td><td class="value" colspan="3">' + safeVal(d.grad_school) + '</td></tr>';
    html += '<tr><td class="label">专业名称</td><td class="value">' + safeVal(d.grad_major) + '</td>';
    html += '<td class="label">层次</td><td class="value">' + safeVal(d.grad_academic_qualification) + '</td></tr>';
    html += '<tr><td class="label">院系</td><td class="value">' + safeVal(d.grad_fenyuan) + '</td>';
    html += '<td class="label">学号</td><td class="value">' + safeVal(d.grad_student_id) + '</td></tr>';
    html += '<tr><td class="label">学习形式</td><td class="value">' + safeVal(d.grad_xltype || d.grad_form) + '</td>';
    html += '<td class="label">培养方式</td><td class="value">' + safeVal(d.grad_grad_category) + '</td></tr>';
    html += '<tr><td class="label">学校类型</td><td class="value">' + safeVal(d.grad_school_type) + '</td>';
    html += '<td class="label">毕业生类别</td><td class="value">' + safeVal(d.grad_xllb) + '</td></tr>';
    html += '<tr><td class="label">班级</td><td class="value">' + safeVal(d.grad_banji) + '</td>';
    html += '<td class="label">证书编号</td><td class="value">' + safeVal(d.grad_bianhao) + '</td></tr>';
    html += '</table>';

    html += '<div class="verify-section">';
    html += '<div class="verify-title">在线验证</div>';
    var gradVerifyCode = generateVerifyCode();
    var gradReportNo = generateReportNo();
    html += '<div class="verify-grid">';
    html += '<div class="v-item"><span class="v-label">在线验证码：</span><span class="v-val">' + gradVerifyCode + '</span></div>';
    html += '<div class="v-item"><span class="v-label">报告编号：</span><span class="v-val">' + gradReportNo + '</span></div>';
    html += '<div class="v-item"><span class="v-label">发证日期：</span><span class="v-val">' + issueDate + '</span></div>';
    html += '<div class="v-item"><span class="v-label">有效期至：</span><span class="v-val">' + expireStr + '</span></div>';
    html += '</div>';
    html += '<div class="verify-qrcode">扫码验证<br>（仅供展示）</div>';
    html += '</div>';

    html += '<div class="report-footer">';
    html += '<p><b>说明：</b></p>';
    html += '<p>1、备案表是依据《高等学校学生学籍学历电子注册办法》（教学[2014]11号）对学历证书电子注册复核备案的结果。</p>';
    html += '<p>2、本备案表为模拟样式，仅供展示用途。正式学信网备案表请访问 https://www.chsi.com.cn 获取。</p>';
    html += '<p class="warn">★ 本页面仅供个人展示使用，不具有官方效力。</p>';
    html += '</div>';

    html += '</div>';
  }

  // Nothing to show
  if (!hasInfo(d) && !showGrad) {
    html = '<div class="no-data"><p>未检测到学历数据</p><p style="margin-top:10px"><a href="index.html">→ 前往填写信息</a></p></div>';
  }

  document.getElementById('reportContainer').innerHTML = html;
}


</script>
</body>
</html>
